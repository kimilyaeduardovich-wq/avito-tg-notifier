name: Avito network diagnose

on:
  workflow_dispatch:

jobs:
  netcheck:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: curl + httpx on ${{ matrix.os }}
        run: |
          set +e
          echo "os=${{ matrix.os }}"
          curl -4 -sS --max-time 10 https://ifconfig.me; echo
          curl -4 -sS --connect-timeout 15 --max-time 30 -o /tmp/b -w "curl_http=%{http_code} t=%{time_total}\n" \
            -X POST "https://api.avito.ru/token" -d "grant_type=client_credentials&client_id=dummy&client_secret=dummy"
          head -c 120 /tmp/b; echo
          pip -q install 'httpx==0.28.1'
          python3 - <<'PY'
          import time, httpx
          ok=fail=0
          for i in range(5):
              t0=time.time()
              try:
                  with httpx.Client(timeout=httpx.Timeout(20.0, connect=10.0)) as c:
                      r=c.post("https://api.avito.ru/token", data={"grant_type":"client_credentials","client_id":"dummy","client_secret":"dummy"})
                  print(f"try{i} ok status={r.status_code} t={time.time()-t0:.2f}")
                  ok+=1
              except Exception as e:
                  print(f"try{i} FAIL {type(e).__name__} t={time.time()-t0:.2f}")
                  fail+=1
          print(f"SUMMARY ok={ok} fail={fail}")
          PY
