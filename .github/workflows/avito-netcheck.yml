name: Avito network diagnose

on:
  workflow_dispatch:

jobs:
  netcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Egress + DNS + curl api.avito.ru
        run: |
          set +e
          echo "=== runner ==="
          uname -a
          echo "=== egress IP ==="
          curl -4 -sS --max-time 10 https://ifconfig.me || true
          echo
          curl -4 -sS --max-time 10 https://api.ipify.org || true
          echo
          echo "=== DNS api.avito.ru ==="
          getent hosts api.avito.ru || true
          dig +short api.avito.ru A || true
          dig +short api.avito.ru AAAA || true
          echo "=== TCP 443 ==="
          timeout 15 bash -c 'echo >/dev/tcp/api.avito.ru/443' && echo tcp_ok || echo tcp_fail
          echo "=== curl -v token endpoint (no secrets) ==="
          curl -4 -v --connect-timeout 15 --max-time 30 -o /tmp/avito_body -w "http_code=%{http_code} time=%{time_total}\n" \
            -X POST "https://api.avito.ru/token" \
            -d "grant_type=client_credentials&client_id=dummy&client_secret=dummy" 2>&1 | tail -40
          echo "=== body head ==="
          head -c 300 /tmp/avito_body; echo
          echo "=== compare telegram ==="
          curl -4 -sS --connect-timeout 10 --max-time 15 -o /dev/null -w "tg_http=%{http_code} time=%{time_total}\n" https://api.telegram.org || true
