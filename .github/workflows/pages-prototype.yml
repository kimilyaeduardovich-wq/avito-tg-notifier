name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "prototype/**"
      - ".github/workflows/pages-prototype.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-prototype
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish prototype/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./prototype
          force_orphan: true
          commit_message: "Deploy Resepshn+ UI prototype"
