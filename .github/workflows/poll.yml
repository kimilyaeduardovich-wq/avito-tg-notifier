name: Avito poll → Telegram

# Надёжный режим без Mac и без внешнего cron:
#   loop ~45 мин, опрос каждые 2 мин → в конце сам запускает следующий loop (self-chain).
# Watchdog: schedule каждые 30 мин перезапускает цепочку, если она оборвалась.
# Состояние: ветка avito-bot-state (push после каждого цикла).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "loop = непрерывный опрос 2 мин (рекомендуется); once = один раз"
        required: false
        default: loop
        type: choice
        options:
          - loop
          - once
          - diagnose
      send_test_alert:
        description: "Отправить тестовое сообщение в TG"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [avito-poll, avito-poll-loop]
  schedule:
    - cron: "0,30 * * * *"

concurrency:
  group: ${{ github.event.inputs.mode == 'diagnose' && format('avito-diag-{0}', github.run_id) || 'avito-poll' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_TEST: ${{ github.event.inputs.send_test_alert }}
        run: |
          MODE="loop"
          TEST="false"
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            # любой внешний kick → loop (стабильность важнее)
            MODE="loop"
            if [ "$EVENT_ACTION" = "avito-poll" ] && [ "${{ github.event.client_payload.mode }}" = "once" ]; then
              MODE="once"
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="${INPUT_MODE:-loop}"
            TEST="${INPUT_TEST:-false}"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            MODE="loop"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "test=$TEST" >> "$GITHUB_OUTPUT"
          echo "Resolved mode=$MODE test=$TEST event=$EVENT_NAME action=$EVENT_ACTION"

      - name: Load seen-state from branch
        if: steps.mode.outputs.mode != 'diagnose'
        run: |
          mkdir -p data
          if git fetch origin avito-bot-state:avito-bot-state 2>/dev/null; then
            git show avito-bot-state:seen.json > data/seen.json 2>/dev/null \
              || echo '{"accounts":{}}' > data/seen.json
            echo "Loaded state from avito-bot-state"
            python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/seen.json").read_text())
          for k,v in (d.get("accounts") or {}).items():
              print(f"  {k}: bootstrapped={v.get('bootstrapped')} seen={len(v.get('seen_message_ids') or [])} chats={len(v.get('chat_updated') or {})}")
          PY
            wc -c data/seen.json
          else
            echo '{"accounts":{}}' > data/seen.json
            echo "No state branch yet — starting empty"
          fi

      - name: Diagnose Avito network from runner
        if: steps.mode.outputs.mode == 'diagnose'
        run: |
          set +e
          echo "=== egress IP ==="
          curl -4 -sS --max-time 10 https://ifconfig.me; echo
          curl -4 -sS --max-time 10 https://api.ipify.org; echo
          echo "=== DNS api.avito.ru ==="
          getent hosts api.avito.ru || true
          dig +short api.avito.ru A || true
          dig +short api.avito.ru AAAA || true
          echo "=== TCP 443 ==="
          timeout 15 bash -c 'echo >/dev/tcp/api.avito.ru/443' && echo tcp_ok || echo tcp_fail
          echo "=== curl POST /token (dummy creds) ==="
          curl -4 -v --connect-timeout 15 --max-time 30 -o /tmp/avito_body -w "http_code=%{http_code} time=%{time_total}\n" \
            -X POST "https://api.avito.ru/token" \
            -d "grant_type=client_credentials&client_id=dummy&client_secret=dummy" 2>&1 | tail -50
          echo "=== body ==="
          head -c 400 /tmp/avito_body; echo
          echo "=== telegram compare ==="
          curl -4 -sS --connect-timeout 10 --max-time 15 -o /dev/null -w "tg_http=%{http_code} time=%{time_total}\n" https://api.telegram.org || true

      - name: Stop after diagnose
        if: steps.mode.outputs.mode == 'diagnose'
        run: echo "diagnose done" && exit 0

      - uses: actions/setup-python@v5
        if: steps.mode.outputs.mode != 'diagnose'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        if: steps.mode.outputs.mode != 'diagnose'
        run: pip install -r requirements.txt

      - name: Write .env from secrets
        if: steps.mode.outputs.mode != 'diagnose'
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ACCOUNT_1_NAME: ${{ secrets.ACCOUNT_1_NAME }}
          ACCOUNT_1_TG_BOT_TOKEN: ${{ secrets.ACCOUNT_1_TG_BOT_TOKEN }}
          ACCOUNT_1_AVITO_CLIENT_ID: ${{ secrets.ACCOUNT_1_AVITO_CLIENT_ID }}
          ACCOUNT_1_AVITO_CLIENT_SECRET: ${{ secrets.ACCOUNT_1_AVITO_CLIENT_SECRET }}
          ACCOUNT_1_AVITO_USER_ID: ${{ secrets.ACCOUNT_1_AVITO_USER_ID }}
          ACCOUNT_2_NAME: ${{ secrets.ACCOUNT_2_NAME }}
          ACCOUNT_2_TG_BOT_TOKEN: ${{ secrets.ACCOUNT_2_TG_BOT_TOKEN }}
          ACCOUNT_2_AVITO_CLIENT_ID: ${{ secrets.ACCOUNT_2_AVITO_CLIENT_ID }}
          ACCOUNT_2_AVITO_CLIENT_SECRET: ${{ secrets.ACCOUNT_2_AVITO_CLIENT_SECRET }}
          ACCOUNT_2_AVITO_USER_ID: ${{ secrets.ACCOUNT_2_AVITO_USER_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          keys = [
            "TG_CHAT_ID",
            "ACCOUNT_1_NAME","ACCOUNT_1_TG_BOT_TOKEN","ACCOUNT_1_AVITO_CLIENT_ID",
            "ACCOUNT_1_AVITO_CLIENT_SECRET","ACCOUNT_1_AVITO_USER_ID",
            "ACCOUNT_2_NAME","ACCOUNT_2_TG_BOT_TOKEN","ACCOUNT_2_AVITO_CLIENT_ID",
            "ACCOUNT_2_AVITO_CLIENT_SECRET","ACCOUNT_2_AVITO_USER_ID",
          ]
          lines = [f"{k}={os.environ.get(k,'')}" for k in keys]
          Path(".env").write_text("\n".join(lines) + "\n", encoding="utf-8")
          missing = [k for k in keys if not os.environ.get(k)]
          if missing:
            raise SystemExit(f"Missing secrets: {', '.join(missing)}")
          print("env ok, keys=", len(keys))
          PY

      - name: Test Telegram delivery
        if: steps.mode.outputs.test == 'true'
        run: python -m scripts.send_test_alert

      - name: Poll once
        if: steps.mode.outputs.mode == 'once'
        run: python -m scripts.run_once

      - name: Poll loop every 2 minutes
        id: poll
        if: steps.mode.outputs.mode == 'loop'
        env:
          POLL_INTERVAL_SEC: "120"
          POLL_LOOP_DURATION_SEC: "2700"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x scripts/push_state.sh
          python -m scripts.run_loop

      - name: Save seen-state to branch
        if: always() && steps.mode.outputs.mode != 'diagnose'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x scripts/push_state.sh
          bash scripts/push_state.sh data/seen.json

      # Chain even if final state push flaked — poll itself already succeeded
      - name: Chain next loop (self-heal continuous poll)
        if: steps.mode.outputs.mode == 'loop' && steps.poll.outcome == 'success'
        env:
          TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "GH_DISPATCH_TOKEN missing — schedule watchdog will restart"
            exit 0
          fi
          CODE=$(curl -sS -o /tmp/chain.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"avito-poll-loop","client_payload":{"source":"self-chain"}}')
          echo "chain_http=$CODE"
          cat /tmp/chain.json 2>/dev/null || true
          if [ "$CODE" != "204" ]; then
            echo "chain failed — schedule watchdog will restart"
            exit 0
          fi
          echo "Next loop queued via repository_dispatch"
