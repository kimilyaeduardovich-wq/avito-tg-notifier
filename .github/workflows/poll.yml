name: Avito poll → Telegram

# Primary reliable trigger: external cron every 2 min → workflow_dispatch
#   (see scripts/setup_cron_hint.md / scripts/cron_dispatch.example.sh)
# GH schedule: two offset */5 crons ≈ every ~2–3 min as free backup (still can delay)
on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [avito-poll]
  schedule:
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 * * * *"
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

concurrency:
  group: avito-poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load seen-state from branch
        run: |
          mkdir -p data
          if git fetch origin avito-bot-state:avito-bot-state 2>/dev/null; then
            git show avito-bot-state:seen.json > data/seen.json 2>/dev/null \
              || echo '{"accounts":{}}' > data/seen.json
            echo "Loaded state from avito-bot-state"
            wc -c data/seen.json
          else
            echo '{"accounts":{}}' > data/seen.json
            echo "No state branch yet — starting empty"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Write .env from secrets
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ACCOUNT_1_NAME: ${{ secrets.ACCOUNT_1_NAME }}
          ACCOUNT_1_TG_BOT_TOKEN: ${{ secrets.ACCOUNT_1_TG_BOT_TOKEN }}
          ACCOUNT_1_AVITO_CLIENT_ID: ${{ secrets.ACCOUNT_1_AVITO_CLIENT_ID }}
          ACCOUNT_1_AVITO_CLIENT_SECRET: ${{ secrets.ACCOUNT_1_AVITO_CLIENT_SECRET }}
          ACCOUNT_1_AVITO_USER_ID: ${{ secrets.ACCOUNT_1_AVITO_USER_ID }}
          ACCOUNT_2_NAME: ${{ secrets.ACCOUNT_2_NAME }}
          ACCOUNT_2_TG_BOT_TOKEN: ${{ secrets.ACCOUNT_2_TG_BOT_TOKEN }}
          ACCOUNT_2_AVITO_CLIENT_ID: ${{ secrets.ACCOUNT_2_AVITO_CLIENT_ID }}
          ACCOUNT_2_AVITO_CLIENT_SECRET: ${{ secrets.ACCOUNT_2_AVITO_CLIENT_SECRET }}
          ACCOUNT_2_AVITO_USER_ID: ${{ secrets.ACCOUNT_2_AVITO_USER_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          keys = [
            "TG_CHAT_ID",
            "ACCOUNT_1_NAME","ACCOUNT_1_TG_BOT_TOKEN","ACCOUNT_1_AVITO_CLIENT_ID",
            "ACCOUNT_1_AVITO_CLIENT_SECRET","ACCOUNT_1_AVITO_USER_ID",
            "ACCOUNT_2_NAME","ACCOUNT_2_TG_BOT_TOKEN","ACCOUNT_2_AVITO_CLIENT_ID",
            "ACCOUNT_2_AVITO_CLIENT_SECRET","ACCOUNT_2_AVITO_USER_ID",
          ]
          lines = [f"{k}={os.environ.get(k,'')}" for k in keys]
          Path(".env").write_text("\n".join(lines) + "\n", encoding="utf-8")
          missing = [k for k in keys if not os.environ.get(k)]
          if missing:
            raise SystemExit(f"Missing secrets: {', '.join(missing)}")
          print("env ok, keys=", len(keys))
          PY

      - name: Poll once
        run: python -m scripts.run_once

      - name: Save seen-state to branch
        if: always()
        run: |
          set -e
          test -f data/seen.json || echo '{"accounts":{}}' > data/seen.json
          git config user.name "avito-tg-notifier"
          git config user.email "avito-tg-notifier@users.noreply.github.com"
          WORK=$(mktemp -d)
          cp data/seen.json "$WORK/seen.json"
          cd "$WORK"
          git init -q
          git checkout -b avito-bot-state
          git add seen.json
          git commit -m "state $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin avito-bot-state
          echo "State pushed to avito-bot-state"
